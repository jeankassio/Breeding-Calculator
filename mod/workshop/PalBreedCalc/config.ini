# ---------------------------------------------------------------
# PalBreedCalc -- configuracao / configuration
# Edite e reinicie o jogo. / Edit and restart the game.
# ---------------------------------------------------------------

# Tecla que abre e fecha a janela. / Key that opens and closes it.
# Aceita: F1..F24, A..Z, 0..9, NUM_0..NUM_9, HOME, END, INSERT,
#         DELETE, PAGE_UP, PAGE_DOWN, TAB, SPACE, ...
hotkey = F6

# Combinacao opcional (true/false). / Optional modifiers.
ctrl = false
alt = false
shift = false

# Tamanho da janela, em % da tela. / Window size, in % of screen.
# A janela nunca abre menor que 1080x860, para a aba "Parents -> Child"
# caber inteira. / Never opens smaller than 1080x860 so the first tab fits.
height_percent = 60
width_percent = 62

# Posicao inicial: top-center, center, top-left, top-right
# Initial position. Depois de mover/redimensionar, o jogo respeita a sua
# escolha ate fechar. / Your own moves win until the game closes.
position = top-center
